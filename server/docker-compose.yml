# 一键部署（API :4000，Playwright + 系统 Chromium）
# 前置: 整个 server/ 目录（含 src/、.env）
# 命令:
#   export DOCKER_BUILDKIT=0
#   docker compose up -d --build
# 健康检查: curl http://127.0.0.1:4000/health

services:
  mongo:
    image: ${MONGO_IMAGE:-docker.1ms.run/library/mongo:7}
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: ${REDIS_IMAGE:-docker.1ms.run/library/redis:7-alpine}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-docker.1ms.run/library/node:22-bookworm}
    image: livestream-monitoring-server:latest
    command: ["node", "dist/main.api.js"]
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      WORKER_MODE: "false"
      API_PORT: "4000"
      MONGODB_URI: mongodb://mongo:27017/livestream
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DOUYIN_PW_EXECUTABLE_PATH: /usr/bin/chromium
      DOUYIN_PW_HEADLESS: "true"
    shm_size: "1gb"
    ports:
      - "4000:4000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  worker:
    image: livestream-monitoring-server:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-docker.1ms.run/library/node:22-bookworm}
    command: ["node", "dist/main.worker.js"]
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      WORKER_MODE: "true"
      MONGODB_URI: mongodb://mongo:27017/livestream
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DOUYIN_PW_EXECUTABLE_PATH: /usr/bin/chromium
      DOUYIN_PW_HEADLESS: "true"
    shm_size: "1gb"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  mongo_data:
  redis_data:
